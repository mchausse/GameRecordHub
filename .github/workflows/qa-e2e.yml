name: QA deployment and end-to-end tests

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  qa:
    name: Deploy and test QA
    runs-on: ubuntu-latest
    environment: QA
    env:
      QA_BASE_URL: https://gamerecordhub-qa.web.app
      QA_E2E_EMAIL: ${{ secrets.QA_E2E_EMAIL }}
      QA_E2E_PASSWORD: ${{ secrets.QA_E2E_PASSWORD }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GAMERECORDHUB_QA }}

      - name: Validate and deploy QA
        run: npm run deploy:qa

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Require QA test credentials
        run: |
          test -n "$QA_E2E_EMAIL"
          test -n "$QA_E2E_PASSWORD"

      - name: Run QA end-to-end tests
        run: npm run test:e2e:qa

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
