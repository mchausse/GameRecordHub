name: SonarQube Cloud

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    name: Test, build, and analyze
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Authenticate with SonarQube Cloud
        id: sonar-auth
        uses: SonarSource/sonarqube-auth-action@v1

      - name: Analyze
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.organization=${{ steps.sonar-auth.outputs.organization }}
            -Dsonar.projectKey=${{ steps.sonar-auth.outputs.project-key }}
