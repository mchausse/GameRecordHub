@if (isLoginPage()) {
  <router-outlet />
} @else {
  <header class="app-bar">
    <a class="brand" routerLink="/games"><span>GR</span> GameRecordHub</a>
    <nav [attr.aria-label]="'Main navigation' | translate">
      <a routerLink="/games" routerLinkActive="active">{{ 'Games' | translate }}</a>
      @if (auth.user()) { <a routerLink="/history" routerLinkActive="active">{{ 'History' | translate }}</a> }
    </nav>
    <div class="account">
      @if (auth.user(); as user) {
        <span class="user-name">{{ user.displayName || 'Player' }}</span>
        <button type="button" (click)="auth.signOut()" [disabled]="auth.busy()">{{ 'Sign out' | translate }}</button>
      } @else {
        <a class="sign-in-link" routerLink="/login">{{ 'Sign in to save' | translate }}</a>
      }
      <app-locale-select />
    </div>
  </header>
  <main class="app-content">
    <router-outlet />
  </main>
}
